var cats=["TOT.Efficacia medio", "Precisione tiri (%)", "Tiri totali", "Tiri in porta", "Precisione passaggi (%)", "Passaggi 3° offensivo", "Precisione 3° offensivo (%)", "Tocchi area avversaria", "Palle lunghe totali", "Precisione palle lunghe (%)", "Duelli a terra (%)", "Duelli aerei (%)", "Dribbling riusciti (%)", "Cross precisi (%)", "Contrasti vinti (%)", "Recuperi", "xG vs Gol segnati", "Gol evitati dal portiere"];
var tabs=document.getElementById('s16-tabs');
var panels=document.getElementById('s16-panels');
cats.forEach(function(cat,ci){
  var tab=document.createElement('button');
  tab.className='s16-tab'+(ci===0?' active':'');
  tab.textContent=cat;
  tab.onclick=function(){
    document.querySelectorAll('.s16-tab').forEach(function(t){t.classList.remove('active')});
    document.querySelectorAll('.s16-panel').forEach(function(p){p.classList.remove('active')});
    tab.classList.add('active');
    document.getElementById('panel-'+ci).classList.add('active');
  };
  tabs.appendChild(tab);
  var panel=document.createElement('div');
  panel.className='s16-panel'+(ci===0?' active':'');
  panel.id='panel-'+ci;
  var rows=DATA[cat];
  var maxVal=Math.max.apply(null,rows.map(function(r){return Math.abs(r.value)}));
  panel.innerHTML='<div class="s16-cat-desc">'+rows[0].desc+'</div>';
  rows.forEach(function(r,i){
    var bw=Math.round(Math.abs(r.value)/maxVal*100);
    var medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1)+'';
    var extraStr='';
    if(r.mode==='xg'&&r.extra!==null) extraStr=' <span style="font-size:9px;color:#9aa0b8">('+r.extra+' gol)</span>';
    if(r.mode==='goev'&&r.extra!==null) extraStr=' <span style="font-size:9px;color:#9aa0b8">('+r.extra+' sub.)</span>';
    var barColor=r.mode==='goev'&&r.value<0?'#dc2626':i===0?'#7c3aed':'#4f46e5';
    panel.innerHTML+=
      '<div class="s16-row">'+
        '<div class="s16-pos">'+medal+'</div>'+
        '<div class="s16-flag"><img src="https://flagcdn.com/w40/'+r.flag+'.png" alt="'+r.name+'"></div>'+
        '<div class="s16-name">'+r.name+'</div>'+
        '<div class="s16-bar-wrap"><div class="s16-bar" style="width:'+bw+'%;background:'+barColor+'"></div></div>'+
        '<div class="s16-val">'+r.value+r.unit+extraStr+'</div>'+
      '</div>';
  });
  panels.appendChild(panel);
});
})();
